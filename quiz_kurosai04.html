<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="GENERATOR" content="JustSystems Homepage Builder Version 22.0.5.0 for Windows">
<meta name="justsystems:DeviceType" content="SmartPhoneV">
<title>動物を救おう</title>
<style>
    :root { --main-color: #4a6741; --correct-color: #2e7d32; --wrong-color: #c62828; }
    body{ font-family: sans-serif; background: #f0f2f0; margin: 0; padding: 20px; }
    .card{ background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    h1{ font-size: 1.2rem; color: var(--main-color); text-align: center; }
    .instruction{ background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.5; border: 1px solid #ddd; }
    
    .choice-btn{ 
        width: 100%; padding: 18px; margin-bottom: 12px; background: white; border: 2px solid #ddd; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.1s ease;
    }
    .choice-btn:active { background-color: #e0e0e0; transform: scale(0.97); }

    .audio-btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.1s ease; }
    .btn-play { background: #4CAF50; color: white; }
    .btn-play:active { background: #388E3C; transform: scale(0.95); }
    .btn-stop { background: #f44336; color: white; }
    .btn-stop:active { background: #d32f2f; transform: scale(0.95); }

    .nav-btn { display: inline-block; padding: 12px 25px; background: #4a6741; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-bottom: 20px; transition: all 0.1s ease; }
    .nav-btn:active { background: #33482d; transform: scale(0.95); }

    #result-area{ display: none; text-align: center; padding: 20px; border-radius: 15px; margin-top: 10px; }
    .judge-mark{ font-size: 3rem; font-weight: bold; margin-bottom: 10px; }
    .retry-btn{ margin-top: 15px; padding: 10px 20px; background: #666; color: white; border: none; border-radius: 5px; }
    .retry-btn:active { background: #444; transform: scale(0.95); }
</style>
</head>
<body>

<div id="game-screen" class="card">
    <h1> クロサイからの依頼 その4</h1>
    <br>
    ---密猟ということは、認められた猟もあるってことですか？ 絶滅危惧種ですよ。猟は全部違法なんじゃないでしょうか！<br><br>
    <div class="instruction">
        <strong>【問題】</strong><br>
        クロサイの狩猟はぜんぶ違法か？
    </div>
    
    <button id="btn-choice1" class="choice-btn" onclick="selectChoice(1)">全部合法</button>
    <button id="btn-choice2" class="choice-btn" onclick="selectChoice(2)">全部違法</button>
    <button id="btn-choice3" class="choice-btn" onclick="selectChoice(3)">一部合法</button>

    <div id="result-area">
        <div id="mark" class="judge-mark"></div>
        <div id="comment"></div>
        <button id="retry" class="retry-btn" onclick="location.reload()">もう一度解く</button>
    </div>
</div>

<div id="speech-text2" style="display: none;">
    ぜつめつ しそう な サイ を ままる ため の おかね を かせる ため に、あえて 一部 の サイ を ごうほうてき に ころす という しくみ が せかい には あります。
    この しくみ は げんざい も せかいてき に さんぴ が わかれて います。
</div>

<script>
if (typeof window.speechSynthesis !== 'undefined') {
    window.speechSynthesis.getVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }
}

function playText(id) {
    if (typeof window.speechSynthesis === 'undefined') return;
    window.speechSynthesis.cancel();
    
    const element = document.getElementById(id);
    if (element) {
        setTimeout(function() {
            const utterance = new SpeechSynthesisUtterance(element.innerText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }, 10);
    }
}

function stopText() {
    if (typeof window.speechSynthesis !== 'undefined') {
        window.speechSynthesis.cancel();
    }
}

function selectChoice(choice) {
    const selectedBtn = document.getElementById('btn-choice' + choice);
    selectedBtn.style.background = "#d1d1d1";
    setTimeout(function() {
        judge(choice);
    }, 150);
}

function judge(choice) {
    const area = document.getElementById('result-area');
    const mark = document.getElementById('mark');
    const comment = document.getElementById('comment');
    document.querySelectorAll('.choice-btn').forEach(b => b.style.display = 'none');
    area.style.display = 'block';

    if (choice === 3) {
        area.style.background = "#e8f5e9";
        area.style.color = "#2e7d32";
        mark.innerText = "⭕ 正解！";
        comment.innerHTML = `
            <strong>一部合法</strong><br>
            <div style="font-size: 0.9rem; text-align: left; margin: 15px 0;">
            ボタンを押すと、以下の解説をスマホが読み上げます（通信費はほとんどかかりません）。<br>
            是非、次の動物に移動しながら、聞いて、考えてください。<br><br>

            <button onclick="playText('speech-text2')" class="audio-btn btn-play">🔊 お話をきく</button>
            <button onclick="stopText()" class="audio-btn btn-stop">⏹ 停止</button>
            <br><br>
             あなたは、クロサイの前に、密猟に関する解説文を見つけました。<br><br>
            「絶滅しそうなサイを『守るためのお金』を稼ぐために、あえて一部のサイを『合法的に殺す』という仕組みが世界にはあります。」<br><br>
            ---合法的殺すなんて信じられません！ いったいどんな論理なのですか！<br><br>
            あなたは少し腹を立てながらも、説明文の続きを読みました。<br><br>
            「ナミビアや南アフリカでは、ワシントン条約（CITES）の枠組みのもとで、高齢の雄などを対象とした狩猟権がオークションにかけられ、高額で落札されています。落札で得られた資金は、密猟監視団の活動資金など、保護活動全般に充てられるとされています。この仕組みは現在も世界的に賛否が分かれています。」<br><br>
             あなたは途方にくれました。<br><br>
            <hr>
             みなさんだったら、このやり方に賛成しますか？ それとも反対しますか。<br>
             そして、他に、クロサイを絶滅から救うには、どんな方法があるでしょうか。<br><br>
             これはあなたへの宿題です。<br>
            </div>
            <a href="Interpreter.html" class="nav-btn">🔙 観にいく動物を選ぶ</a>
        `;
    } else {
        area.style.background = "#ffebee";
        area.style.color = "#c62828";
        mark.innerText = "❌ ザンネン！";
        comment.innerHTML = "もう一度考えてみよう";
    }
}
</script>
</body>
</html>
