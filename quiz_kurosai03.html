<html lang="ja">
<head>

<meta name="GENERATOR" content="JustSystems Homepage Builder Version 22.0.5.0 for Windows">
<meta name="justsystems:DeviceType" content="SmartPhoneV">
<title>動物を救おう</title>
<style>

	font-family: sans-serif; background: #f0f2f0; margin: 0; padding: 20px;

}

	background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.5; border: 1px solid #ddd;
}
    
    .choice-btn{
	 
        width: 100%; padding: 18px; margin-bottom: 12px; background: white; border: 2px solid #ddd; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.1s ease;
    }
    .choice-btn:active{
	background-color: #e0e0e0; transform: scale(0.97);
}

	padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.1s ease;
}

	background: #4CAF50; color: white;
}

	background: #388E3C; transform: scale(0.95);
}

	background: #f44336; color: white;
}

	background: #d32f2f; transform: scale(0.95);
}

    .nav-btn{
	display: inline-block; padding: 12px 25px; background: #4a6741; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-bottom: 20px; transition: all 0.1s ease;
}

}

	display: none; text-align: center; padding: 20px; border-radius: 15px; margin-top: 10px;

	margin-top: 15px; padding: 10px 20px; background: #666; color: white; border: none; border-radius: 5px;

-->
</style>
</head>
<body>

<div id="game-screen" class="card">
    <h1> クロサイからの依頼 その３</h1>
v.1.0.1<br>
<br>
    ----ひょっとして、その原因は私たち人間にあるのでは？<br><br>

    <div class="instruction">
        <strong>【問題】</strong><br>
        クロサイが絶滅の危機に瀕している原因として間違っているものはどれでしょう。
    </div>
    
    <button id="btn-choice1" class="choice-btn" onclick="selectChoice(1)">密漁</button>
    <button id="btn-choice2" class="choice-btn" onclick="selectChoice(2)">サバンナ開発</button>
    <button id="btn-choice3" class="choice-btn" onclick="selectChoice(3)">ナイルワニの大繁殖</button>

    <div id="result-area">
        <div id="mark" class="judge-mark"></div>
        <div id="comment"></div>
        <button id="retry" class="retry-btn" onclick="location.reload()">もう一度解く</button>
    </div>
</div>

<div id="speech-text2" style="display: none;">
    クロサイ の いのち を もっとも おびやかして いる のが、とくちょうてき な あの つの を ねらった ようしゃない みつりょう です。
    また、アフリカ の じんこう ぞうか や けいざい かいはつ に ともない、かれら が くらす サバンナ が のうち に かえられて しまった こと も だいダメージ です。
</div>

<script>
if (typeof window.speechSynthesis !== 'undefined') {
    window.speechSynthesis.getVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }
}

function playText(id) {
    if (typeof window.speechSynthesis === 'undefined') return;
    window.speechSynthesis.cancel();
    
    const element = document.getElementById(id);
    if (element) {
        setTimeout(function() {
            const utterance = new SpeechSynthesisUtterance(element.innerText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }, 10);
    }
}

function stopText() {
    if (typeof window.speechSynthesis !== 'undefined') {
        window.speechSynthesis.cancel();
    }
}

function selectChoice(choice) {
    const selectedBtn = document.getElementById('btn-choice' + choice);
    selectedBtn.style.background = "#d1d1d1";
    setTimeout(function() {
        judge(choice);
    }, 150);
}

function judge(choice) {
    const area = document.getElementById('result-area');
    const mark = document.getElementById('mark');
    const comment = document.getElementById('comment');
    document.querySelectorAll('.choice-btn').forEach(b => b.style.display = 'none');
    area.style.display = 'block';

    if (choice === 3) {
        area.style.background = "#e8f5e9";
        area.style.color = "#2e7d32";
        mark.innerText = "⭕ 正解！";
        comment.innerHTML = `
            <strong>「ナイルワニの大繁殖」という事実はありません</strong><br>
            <div style="font-size: 0.9rem; text-align: left; margin: 15px 0;">
            ボタンを押すと、以下の解説をスマホが読み上げます（通信費はほとんどかかりません）。<br>
            是非、次の動物に移動しながら、聞いて、考えてください。<br><br>

            <button onclick="playText('speech-text2')" class="audio-btn btn-play">🔊 お話をきく</button>
            <button onclick="stopText()" class="audio-btn btn-stop">⏹ 停止</button>
            <br><br>
            ナイルワニがクロサイを襲うケースは稀にはあるけど、クロサイを絶滅に追い込むほど大繁殖はしていません。
            <hr><br>
<div style="color: #000000 !important; margin-top: 20px;">

             あなたは、クロサイの前に、絶滅に関する解説文を見つけました。<br><br>
            「クロサイの命を最も脅かしているのが、特徴的なあの「角」を狙った容赦ない密猟です。
クロサイの角は「解熱や解毒に効く万能薬」と信じられていたり、一部の国で装飾品として珍重されたりしてきた歴史があります。
実は、サイの角は人間の爪や髪の毛と同じケラチンという成分でできていて、科学的な薬効は認められていないのに、闇市場では超高値で取引されるため乱獲が止まりません。<br>
             また、アフリカの人口増加や経済開発にともなって、クロサイが暮らすサバンナや低木林が農地・放牧地に変えられてしまったことも大ダメージです。
住処を追われるだけでなく、エリアが道路などでバラバラに分断されることで、繁殖のチャンス自体が減ってしまっています。」<br><br>
            ----わたしたち人間が原因なんですね。じゃあ、クロサイを絶滅から救う方法を考えるのもわたしたち人間の責任じゃないですか。<br><br>
             いったいどんな方法があるのでしょうか。これはあなたへの宿題です。
            </div>
            </div>
            <a href="INTERPRITER.html" class="nav-btn">🔙 観に行く動物を選ぶ</a>
        `;
    } else {
        area.style.background = "#ffebee";
        area.style.color = "#c62828";
        mark.innerText = "❌ ザンネン！";
        comment.innerHTML = "もう一度考えてみよう";
    }
}
</script>
</body>
</html>
